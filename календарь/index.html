<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь 2026–2027 — Октябрь 2026 – Май 2027 · Дела по дням</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #090A0F;
            --bg-card: #12141C;
            --text-white: #E2E8F0;
            --text-gray: #94A3B8;
            --accent-gold: #D4AF37;
            --accent-soft: #38BDF8;
            --accent-green: #34D399;
            --accent-violet: #A78BFA;
            --font-head: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: var(--font-body);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 40px;
        }
        h1 {
            font-family: var(--font-head);
            font-size: 2.5rem;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .month-block {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid transparent;
        }

        .month-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .month-block.has-month-note {
            border-color: rgba(167, 139, 250, 0.25);
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .month-name {
            font-family: var(--font-head);
            font-size: 1.4rem;
            font-weight: 600;
        }

        .month-name.clickable {
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .month-name.clickable::after {
            content: 'i';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            margin-left: 7px;
            border-radius: 50%;
            border: 1px solid rgba(167, 139, 250, 0.6);
            color: var(--accent-violet);
            font-family: var(--font-body);
            font-size: 0.6rem;
            font-weight: 600;
            line-height: 1;
            vertical-align: middle;
            transform: translateY(-2px);
        }
        .month-name.clickable:hover {
            color: var(--accent-violet);
        }

        .phase-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-gray);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .day-name {
            font-size: 0.7rem;
            color: var(--text-gray);
            font-weight: 500;
            margin-bottom: 5px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background: rgba(255,255,255,0.02);
        }

        .day-cell:hover {
            background: rgba(56, 189, 248, 0.12);
        }

        .day-cell.empty {
            visibility: hidden;
        }

        .day-cell.has-note::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-gold);
        }

        .day-cell.has-done::before {
            content: '';
            position: absolute;
            bottom: 3px;
            left: calc(50% + 7px);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .day-cell.today {
            outline: 2px solid #fff;
            outline-offset: -2px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .day-cell.weekend {
            color: #FCA5A5;
        }

        #info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 340px;
            max-height: 70vh;
            overflow-y: auto;
            background: #1E293B;
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        #info-panel.visible {
            transform: translateY(0);
        }
        #info-panel.month-mode {
            border-color: var(--accent-violet);
        }

        @media (max-width: 768px) {
            #info-panel {
                top: 0;
                bottom: auto;
                left: 10px;
                right: 10px;
                width: auto;
                max-height: 70vh;
                border-radius: 0 0 12px 12px;
                padding-top: 30px;
                transform: translateY(-150%);
            }
            #info-panel.visible {
                transform: translateY(0);
            }
            .year-grid {
                grid-template-columns: 1fr;
            }
        }

        .ip-date {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }
        #info-panel.month-mode .ip-date {
            color: var(--accent-violet);
        }
        .ip-week {
            font-size: 0.8rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .ip-task {
            font-size: 0.95rem;
            color: var(--text-white);
            margin-bottom: 10px;
            font-weight: 500;
        }
        .ip-task ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .ip-task li {
            padding: 5px 0 5px 16px;
            position: relative;
            font-weight: 400;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .ip-task li:last-child {
            border-bottom: none;
        }
        .ip-task li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent-gold);
            font-weight: 700;
        }
        .ip-detail {
            font-size: 0.85rem;
            color: #CBD5E1;
            font-style: italic;
            white-space: pre-wrap;
        }

        .ip-month-note {
            font-size: 0.92rem;
            color: #E9D5FF;
            line-height: 1.6;
            padding: 12px 14px;
            background: rgba(167, 139, 250, 0.08);
            border-left: 3px solid var(--accent-violet);
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .ip-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin: 18px 0 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .ip-section-title.done-title {
            color: var(--accent-green);
        }
        .ip-section-title.planned-title {
            color: var(--accent-gold);
        }
        .ip-section-title.month-title {
            color: var(--accent-violet);
        }
        .ip-done ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .ip-done li {
            padding: 5px 0 5px 20px;
            position: relative;
            font-weight: 400;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #D1FAE5;
        }
        .ip-done li:last-child {
            border-bottom: none;
        }
        .ip-done li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: 700;
        }

        .close-ip {
            position: absolute;
            top: 10px;
            right: 12px;
            cursor: pointer;
            color: var(--text-gray);
            font-size: 1.4rem;
            line-height: 1;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Календарь 2026–2027</h1>
        <p style="color:var(--text-gray)">Дела по дням · Октябрь 2026 — Май 2027</p>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:var(--accent-gold)"></span> Есть дела</div>
            <div class="legend-item"><span class="dot" style="background:var(--accent-green)"></span> Есть сделанное</div>
            <div class="legend-item"><span class="dot" style="background:var(--accent-violet)"></span> Заметка месяца</div>
            <div class="legend-item"><span class="dot" style="background:#fff"></span> Сегодня</div>
            <div class="legend-item"><span class="dot" style="background:#FCA5A5"></span> Выходной</div>
        </div>
    </header>

    <main id="calendar-root" class="year-grid"></main>
</div>

<div id="info-panel">
    <span class="close-ip" onclick="hideInfo()">×</span>
    <div class="ip-date" id="ip-date-display">Дата</div>
    <div class="ip-week" id="ip-week-display">Неделя</div>

    <div id="ip-month-wrap" style="display:none;">
        <div class="ip-section-title month-title">Заметка месяца</div>
        <div class="ip-month-note" id="ip-month-display"></div>
    </div>

    <div id="ip-done-wrap" style="display:none;">
        <div class="ip-section-title done-title">Сделано</div>
        <div class="ip-done" id="ip-done-display"></div>
    </div>

    <div id="ip-planned-wrap">
        <div class="ip-section-title planned-title">Дела дня</div>
        <div class="ip-task" id="ip-task-display">Дела дня</div>
    </div>

    <div class="ip-detail" id="ip-detail-display"></div>
</div>

<script>
    // =====================================================================
    // ДИАПАЗОН: с октября 2026 по май 2027 включительно
    // =====================================================================
    const RANGE_START = { year: 2026, month: 9 };
    const RANGE_END   = { year: 2027, month: 4 };

    const NOTES = {};
    const DONE  = {};
    const MONTH_NOTES = {};

    function addTask(dateStr, task) {
        if (!NOTES[dateStr]) NOTES[dateStr] = { tasks: [] };
        NOTES[dateStr].tasks.push(task);
    }

    function addDone(dateStr, task) {
        if (!DONE[dateStr]) DONE[dateStr] = { tasks: [] };
        DONE[dateStr].tasks.push(task);
    }

    function setMonthNote(mKey, text) {
        MONTH_NOTES[mKey] = text;
    }

    // ---------- ЗАМЕТКИ МЕСЯЦЕВ ----------
    setMonthNote(
        '2026-10',
        `До конца октября нужно завершить эпопею с Димой и желательно внести платёж, чтобы с ноября спокойно работать дальше и наводить порядки.`
    );

    setMonthNote(
        '2026-11',
        `Исходя из того что я знаю что нахожусь не на своем месте и это ведет в пропасть или еще хуже, необходимо найти решения изменить всю жизнь кардинально, делая списки дел по календарю и плюс то, что изменит жизнь, а это еще дополнительные дела которые выведут туда куда я хочу. Чтобы понять что я хочу нужно это представлять и работать над этим отдельно и сосредоточенно.`
    );

    // ---------- 24 ОКТЯБРЯ 2026 — СДЕЛАНО ----------
    [
        'Привезли воды 4 раза',
        'Антоша приехал, уазик пытались вытянуть',
        'Стоплена баня',
        'Постирал вручную до х',
        'Сварил рис правильно',
        'В магаз съездили и озон'
    ].forEach(t => addDone('2026-10-24', t));

    // ---------- 25 ОКТЯБРЯ 2026 — СДЕЛАНО ----------
    [
        'Сделали печку на улице',
        'Пожарили картошки',
        'Стопили баню',
        'Убрал вниз 5 ведер картошки'
    ].forEach(t => addDone('2026-10-25', t));

    // ---------- 26 ОКТЯБРЯ 2026 — СДЕЛАНО ----------
    [
        'Сделали половину крыши',
        'Сварил макарон',
        'Сделал этот календарь'
    ].forEach(t => addDone('2026-10-26', t));

    // ---------- ОКТЯБРЬ 2026: задачи на каждый день ----------
    const octoberDaily = [
        'Купить аккаунт фэйсбука',
        'Перевыложить объявл на авито'
    ];

    const octoberLate = [
        'Картошку перебрать и опустить',
        'Крыша на бане починить',
        'Яблоки собрать остатки',
        'Засолки с Пушкина привезти',
        'Кабачки увезти в Пушкин',
        'Посмотреть диаметр трубы на 3 чердаке'
    ];

    for (let d = 1; d <= 31; d++) {
        const key = '2026-10-' + String(d).padStart(2, '0');
        octoberDaily.forEach(t => addTask(key, t));

        if (d >= 26) {
            octoberLate.forEach(t => addTask(key, t));
            addTask(key, 'Со 2 этажа спустить технику (до 5 ноября)');
        }
    }

    // ---------- НОЯБРЬ 2026 ----------
    addTask('2026-11-01', 'Предбанничек дома убрать, вынести холодильник');
    addTask('2026-11-01', 'Кошек переселить, лотки поменять');
    addTask('2026-11-01', 'Убраться на веранде нов. дом (Дима уехал)');
    addTask('2026-11-01', 'Распределить конвекторы по домам');
    addTask('2026-11-01', 'Комната левая очистить (ноябрь)');
    addTask('2026-11-01', 'Дрова запасти, пилу починить');
    addTask('2026-11-01', 'Со 2 этажа спустить технику (до 5 ноября)');

    addTask('2026-11-02', 'Распределить конвекторы по домам');
    addTask('2026-11-02', 'Комната левая очистить (ноябрь)');
    addTask('2026-11-02', 'Дрова запасти, пилу починить');
    addTask('2026-11-02', 'Со 2 этажа спустить технику (до 5 ноября)');

    addTask('2026-11-03', 'Топинамбур: сходить до поля, выкопать');
    addTask('2026-11-03', 'Распределить конвекторы по домам');
    addTask('2026-11-03', 'Комната левая очистить (ноябрь)');
    addTask('2026-11-03', 'Дрова запасти, пилу починить');
    addTask('2026-11-03', 'Со 2 этажа спустить технику (до 5 ноября)');

    addTask('2026-11-04', 'Топинамбур: сходить до поля, выкопать');
    addTask('2026-11-04', 'Распределить конвекторы по домам (последний день)');
    addTask('2026-11-04', 'Комната левая очистить (ноябрь)');
    addTask('2026-11-04', 'Дрова запасти, пилу починить');
    addTask('2026-11-04', 'Со 2 этажа спустить технику (до 5 ноября)');

    addTask('2026-11-05', 'Топинамбур: сходить до поля, выкопать');
    addTask('2026-11-05', 'Теплицу вычистить, укроп на еду');
    addTask('2026-11-05', 'Комната левая очистить (ноябрь)');
    addTask('2026-11-05', 'Дрова запасти, пилу починить');
    addTask('2026-11-05', 'Со 2 этажа спустить технику (последний день)');

    for (let d = 6; d <= 10; d++) {
        const key = '2026-11-' + String(d).padStart(2, '0');
        addTask(key, 'Топинамбур: сходить до поля, выкопать');
        addTask(key, 'Теплицу вычистить, укроп на еду');
        addTask(key, 'Комната левая очистить (ноябрь)');
        addTask(key, 'Дрова запасти, пилу починить');
    }

    for (let d = 11; d <= 30; d++) {
        const key = '2026-11-' + String(d).padStart(2, '0');
        addTask(key, 'Комната левая очистить (ноябрь)');
        addTask(key, 'Дрова запасти, пилу починить');
    }

    // =====================================================================
    // УТИЛИТЫ
    // =====================================================================
    const PLACEHOLDER_TASK = 'Дел на этот день нет';

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function dateKey(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
    function monthKey(y, m) { return y + '-' + pad(m + 1); }
    function getMonthName(date) { return date.toLocaleDateString('ru-RU', { month: 'long' }); }
    function isSameDay(d1, d2) {
        return d1.getDate() === d2.getDate() &&
               d1.getMonth() === d2.getMonth() &&
               d1.getFullYear() === d2.getFullYear();
    }
    function getISOWeek(date) {
        const tmp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = tmp.getUTCDay() || 7;
        tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
        return Math.ceil(((tmp - yearStart) / 86400000 + 1) / 7);
    }
    function keyOf(date) {
        return dateKey(date.getFullYear(), date.getMonth(), date.getDate());
    }
    function getNote(date) { return NOTES[keyOf(date)] || null; }
    function getDone(date) { return DONE[keyOf(date)] || null; }
    function getMonthNote(y, m) { return MONTH_NOTES[monthKey(y, m)] || null; }

    function renderCalendar() {
        const root = document.getElementById('calendar-root');
        root.innerHTML = '';

        let curYear = RANGE_START.year;
        let curMonth = RANGE_START.month;

        while (
            curYear < RANGE_END.year ||
            (curYear === RANGE_END.year && curMonth <= RANGE_END.month)
        ) {
            const firstOfMonth = new Date(curYear, curMonth, 1);
            const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
            const firstDayOfWeek = firstOfMonth.getDay();
            const offset = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
            const mNote = getMonthNote(curYear, curMonth);

            const monthBlock = document.createElement('div');
            monthBlock.className = 'month-block';
            if (mNote) monthBlock.classList.add('has-month-note');

            const headerDiv = document.createElement('div');
            headerDiv.className = 'month-header';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'month-name';
            nameSpan.innerText = getMonthName(firstOfMonth) + ' ' + curYear;
            if (mNote) {
                nameSpan.classList.add('clickable');
                nameSpan.dataset.monthKey = monthKey(curYear, curMonth);
                nameSpan.dataset.monthLabel = getMonthName(firstOfMonth) + ' ' + curYear;
                nameSpan.title = 'Показать заметку месяца';
            }

            const phaseSpan = document.createElement('span');
            phaseSpan.className = 'phase-label';
            phaseSpan.innerText = daysInMonth + ' дн.';

            headerDiv.appendChild(nameSpan);
            headerDiv.appendChild(phaseSpan);
            monthBlock.appendChild(headerDiv);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'days-grid';

            ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(day => {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.innerText = day;
                gridDiv.appendChild(el);
            });

            for (let i = 0; i < offset; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                gridDiv.appendChild(empty);
            }

            for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
                const cellDate = new Date(curYear, curMonth, dayNum);
                const dow = cellDate.getDay();

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerText = dayNum;
                cell.dataset.date = dateKey(curYear, curMonth, dayNum);

                if (dow === 0 || dow === 6) cell.classList.add('weekend');
                if (getNote(cellDate)) cell.classList.add('has-note');
                if (getDone(cellDate)) cell.classList.add('has-done');
                if (isSameDay(cellDate, new Date())) cell.classList.add('today');

                gridDiv.appendChild(cell);
            }

            monthBlock.appendChild(gridDiv);
            root.appendChild(monthBlock);

            curMonth++;
            if (curMonth > 11) { curMonth = 0; curYear++; }
        }
    }

    function showDayInfo(dateStr) {
        const panel = document.getElementById('info-panel');
        panel.classList.remove('month-mode');

        const parts = dateStr.split('-').map(Number);
        const y = parts[0], m = parts[1], d = parts[2];
        const dateObj = new Date(y, m - 1, d);
        const note = getNote(dateObj);
        const done = getDone(dateObj);

        const weekday = dateObj.toLocaleDateString('ru-RU', { weekday: 'long' });
        const monthName = dateObj.toLocaleDateString('ru-RU', { month: 'long' });
        const week = getISOWeek(dateObj);

        document.getElementById('ip-date-display').innerText = weekday + ', ' + d + ' ' + monthName + ' ' + y;
        document.getElementById('ip-week-display').innerText = 'Неделя ' + week;

        document.getElementById('ip-month-wrap').style.display = 'none';

        const doneWrap = document.getElementById('ip-done-wrap');
        const doneEl = document.getElementById('ip-done-display');
        if (done && done.tasks && done.tasks.length) {
            doneEl.innerHTML = '<ul>' + done.tasks.map(t => '<li>' + t + '</li>').join('') + '</ul>';
            doneWrap.style.display = 'block';
        } else {
            doneEl.innerHTML = '';
            doneWrap.style.display = 'none';
        }

        const plannedWrap = document.getElementById('ip-planned-wrap');
        const taskEl = document.getElementById('ip-task-display');
        if (note && note.tasks && note.tasks.length) {
            taskEl.innerHTML = '<ul>' + note.tasks.map(t => '<li>' + t + '</li>').join('') + '</ul>';
            plannedWrap.style.display = 'block';
        } else if (done && done.tasks && done.tasks.length) {
            taskEl.innerHTML = '';
            plannedWrap.style.display = 'none';
        } else {
            taskEl.innerText = PLACEHOLDER_TASK;
            plannedWrap.style.display = 'block';
        }

        document.getElementById('ip-detail-display').innerText = '';
        panel.classList.add('visible');
    }

    function showMonthInfo(mKey, label) {
        const panel = document.getElementById('info-panel');
        panel.classList.add('month-mode');

        const text = MONTH_NOTES[mKey] || '';

        document.getElementById('ip-date-display').innerText = label;
        document.getElementById('ip-week-display').innerText = 'Заметка месяца';

        const monthWrap = document.getElementById('ip-month-wrap');
        const monthEl = document.getElementById('ip-month-display');
        if (text) {
            monthEl.innerText = text;
            monthWrap.style.display = 'block';
        } else {
            monthWrap.style.display = 'none';
        }

        document.getElementById('ip-done-wrap').style.display = 'none';
        document.getElementById('ip-planned-wrap').style.display = 'none';
        document.getElementById('ip-detail-display').innerText = '';

        panel.classList.add('visible');
    }

    function hideInfo() {
        const panel = document.getElementById('info-panel');
        panel.classList.remove('visible');
        panel.classList.remove('month-mode');
    }

    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('month-name') && e.target.classList.contains('clickable')) {
            showMonthInfo(e.target.dataset.monthKey, e.target.dataset.monthLabel);
            return;
        }
        if (e.target.classList.contains('day-cell') && !e.target.classList.contains('empty')) {
            const isoDate = e.target.dataset.date;
            if (isoDate) showDayInfo(isoDate);
        }
    });

    renderCalendar();
</script>
</body>
</html>
