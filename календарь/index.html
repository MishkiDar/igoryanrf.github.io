<html lang="ru">

    <title>Календарь 2026–2027 — Октябрь 2026 – Май 2027 · Дела по дням</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #090A0F;
            --bg-card: #12141C;
            --text-white: #E2E8F0;
            --text-gray: #94A3B8;
            --accent-gold: #D4AF37;
            --accent-soft: #38BDF8;
            --accent-green: #34D399;
            --accent-violet: #A78BFA;
            --font-head: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: var(--font-body);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 40px;
        }
        h1 {
            font-family: var(--font-head);
            font-size: 2.5rem;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .month-block {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid transparent;
        }
