<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark 3D Spatial Interface — Interactive</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 20, 40, 0.7);
            padding: 15px 25px;
            border-left: 4px solid #00d4ff;
            border-radius: 4px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        #info h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #00d4ff;
            text-transform: uppercase;
        }
        #info p {
            margin: 0;
            font-size: 12px;
            color: #a0c0d0;
        }
        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
            pointer-events: none;
            z-index: 100;
            text-align: center;
            line-height: 1.5;
        }
        .hint b {
            color: #ffffff;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #00d4ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99;
            box-shadow: 0 0 10px #00d4ff;
            opacity: 0.6;
        }
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 5, 15, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            cursor: pointer;
        }
        #blocker div {
            background: rgba(0, 30, 60, 0.9);
            padding: 30px 50px;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            text-align: center;
        }
        #blocker h2 {
            margin: 0 0 10px 0;
            color: #00d4ff;
            letter-spacing: 2px;
        }
        #blocker p {
            margin: 0;
            color: #a0c0d0;
            font-size: 14px;
        }
        /* Режим редактирования */
        body.edit-mode #crosshair {
            display: none;
        }
        body.edit-mode #edit-badge {
            display: block;
        }
        #edit-badge {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 170, 0, 0.15);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }
        /* Стили для интерактивных панелей */
        .panel-interactive {
            transition: all 0.2s ease;
            pointer-events: none;
        }
        body.edit-mode .panel-interactive {
            pointer-events: auto;
            cursor: pointer;
        }
        body.edit-mode .panel-interactive:hover {
            transform: scale(1.02);
        }
        .panel-active {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.8) !important;
            border-color: #00ffaa !important;
        }
        .panel-interactive input[type="text"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #e0f0ff;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            width: 100%;
        }
        .panel-interactive input[type="text"]:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }
        .panel-interactive button {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: #00d4ff;
            border-radius: 3px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .panel-interactive button:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .panel-interactive .del-btn {
            color: #ff5566;
            border-color: rgba(255, 85, 102, 0.5);
            background: rgba(255, 85, 102, 0.1);
            padding: 0 6px;
            line-height: 1;
        }
        .panel-interactive .del-btn:hover {
            background: rgba(255, 85, 102, 0.3);
            box-shadow: 0 0 10px rgba(255, 85, 102, 0.5);
        }
        .panel-interactive .status-toggle {
            cursor: pointer;
            user-select: none;
            padding: 1px 6px;
            border-radius: 3px;
            transition: all 0.2s;
        }
        .panel-interactive .status-toggle:hover {
            background: rgba(0, 212, 255, 0.2);
        }
        .chart-bar {
            cursor: pointer;
            transition: all 0.2s;
        }
        body.edit-mode .chart-bar:hover {
            opacity: 0.7;
            filter: brightness(1.5);
        }
        .editable-text {
            outline: none;
            border-radius: 3px;
            padding: 4px;
            transition: all 0.2s;
        }
        body.edit-mode .editable-text:hover {
            background: rgba(0, 212, 255, 0.1);
        }
        body.edit-mode .editable-text:focus {
            background: rgba(0, 212, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>J.A.R.V.I.S. Interface</h1>
        <p>Flight Mode: Active | Spatial Computing Online</p>
    </div>
    <div id="edit-badge">✎ EDIT MODE — Press E to exit</div>
    <div id="crosshair"></div>
    <div class="hint">
        <b>W / A / S / D</b> — движение &nbsp;|&nbsp; <b>Space</b> — вверх &nbsp;|&nbsp; <b>Shift</b> — вниз<br>
        <b>E</b> — режим редактирования &nbsp;|&nbsp; <b>ESC</b> — освободить курсор
    </div>

    <div id="blocker">
        <div>
            <h2>CLICK TO ENGAGE</h2>
            <p>Нажмите, чтобы захватить мышь и начать полёт</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 1. Сцена, камера, рендереры ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.008);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 2. Управление ---
        const controls = new PointerLockControls(camera, renderer.domElement);
        const blocker = document.getElementById('blocker');

        let isEditMode = false;

        blocker.addEventListener('click', () => {
            if (!isEditMode) controls.lock();
        });

        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
        });

        controls.addEventListener('unlock', () => {
            if (!isEditMode) blocker.style.display = 'flex';
        });

        scene.add(controls.getObject());

        // Клавиши
        const keyState = {
            w: false, a: false, s: false, d: false,
            space: false, shift: false
        };

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': keyState.w = true; break;
                case 'KeyA': keyState.a = true; break;
                case 'KeyS': keyState.s = true; break;
                case 'KeyD': keyState.d = true; break;
                case 'Space': keyState.space = true; break;
                case 'ShiftLeft': case 'ShiftRight': keyState.shift = true; break;
                case 'KeyE':
                    e.preventDefault();
                    toggleEditMode();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': keyState.w = false; break;
                case 'KeyA': keyState.a = false; break;
                case 'KeyS': keyState.s = false; break;
                case 'KeyD': keyState.d = false; break;
                case 'Space': keyState.space = false; break;
                case 'ShiftLeft': case 'ShiftRight': keyState.shift = false; break;
            }
        });

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);

            if (isEditMode) {
                // Выходим из Pointer Lock
                if (controls.isLocked) controls.unlock();
                blocker.style.display = 'none';
                // Разрешаем клики по labelRenderer
                labelRenderer.domElement.style.pointerEvents = 'none';
                // Но панели должны быть кликабельны — они в CSS2DObject внутри labelRenderer
                // CSS2DObject рендерится как div внутри labelRenderer.domElement
                // Установим pointer-events: auto для самих панелей через класс
            } else {
                blocker.style.display = 'flex';
            }
        }

        // --- 3. Освещение ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00d4ff, 1, 50);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff00ff, 0.5, 50);
        pointLight2.position.set(-5, -5, -5);
        scene.add(pointLight2);

        // --- 4. Окружение ---
        const gridHelper = new THREE.GridHelper(100, 100, 0x00d4ff, 0x1a1a3a);
        gridHelper.position.y = -3;
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(10);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.3;
        scene.add(axesHelper);

        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 200;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x00d4ff,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        // --- 5. Генерация HTML панели с интерактивом ---
        let panelIdCounter = 0;

        function createPanelContent(panel) {
            const id = panel.id;
            const type = panel.type;
            const data = panel.data;

            let html = `
                <div class="panel-interactive" data-panel-id="${id}" style="
                    background: rgba(10, 25, 45, 0.85);
                    border: 1px solid #00d4ff;
                    border-radius: 8px;
                    padding: 15px;
                    width: 250px;
                    color: #e0f0ff;
                    font-family: 'Segoe UI', sans-serif;
                    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
                    backdrop-filter: blur(5px);
                ">
                    <h3 style="margin: 0 0 10px 0; color: #00d4ff; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,212,255,0.3); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
                        <span class="editable-text" data-field="title">${panel.title}</span>
                        <button class="del-btn" data-action="delete-panel" title="Удалить панель" style="font-size: 10px;">✕</button>
                    </h3>
            `;

            if (type === 'list') {
                html += `<ul style="list-style: none; padding: 0; margin: 0; font-size: 12px;" data-list-id="${id}">`;
                data.forEach((item, idx) => {
                    html += `<li style="margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 4px;">
                        <span class="editable-text" data-field="item-label" data-index="${idx}" style="flex: 1;">${item.label}</span>
                        <span class="status-toggle" data-action="toggle-status" data-index="${idx}" style="color: ${item.status === 'done' ? '#00ff88' : '#ffaa00'}; font-size: 11px; white-space: nowrap;">${item.value}</span>
                        <button class="del-btn" data-action="delete-item" data-index="${idx}" title="Удалить">✕</button>
                    </li>`;
                });
                html += `</ul>`;
                html += `<button data-action="add-item" style="margin-top: 8px; width: 100%;">+ Add Item</button>`;
            } else if (type === 'chart') {
                html += `<div style="display: flex; align-items: flex-end; height: 60px; gap: 5px; margin-top: 10px;" data-chart-id="${id}">`;
                data.forEach((val, idx) => {
                    const height = val * 0.6;
                    html += `<div class="chart-bar" data-action="edit-bar" data-index="${idx}" style="flex: 1; background: linear-gradient(to top, #00d4ff, #0055ff); height: ${height}px; border-radius: 2px;" title="Клик: изменить значение"></div>`;
                });
                html += `</div>`;
                html += `<div style="display: flex; justify-content: space-between; font-size: 10px; color: #88aadd; margin-top: 5px;">
                    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
                </div>`;
                html += `<div style="font-size: 10px; color: #88aadd; margin-top: 4px; text-align: center;">Click bars to randomize</div>`;
            } else if (type === 'text') {
                html += `<p class="editable-text" data-field="text" style="font-size: 12px; line-height: 1.5; margin: 0; color: #b0d0e0;">${data}</p>`;
            }

            html += `</div>`;
            return html;
        }

        // --- 6. Модель данных панелей ---
        const panelModels = [
            { id: panelIdCounter++, title: 'Daily Plan', type: 'list', data: [
                { label: '09:00 Meeting', status: 'done', value: 'Done' },
                { label: '11:00 Code Review', status: 'pending', value: 'In 2h' },
                { label: '14:00 Launch', status: 'pending', value: 'Critical' },
                { label: '18:00 Gym', status: 'pending', value: 'Skipped' }
            ], pos: [4, 1, -3] },
            { id: panelIdCounter++, title: 'System Metrics', type: 'chart', data: [40, 60, 30, 80, 50], pos: [-4, 1, -3] },
            { id: panelIdCounter++, title: 'Global Data Analysis', type: 'text', data: 'Analyzing 4.2M data points... Pattern detected in sector 7. Probability of anomaly: 12%. Recommend recalibration of sensors.', pos: [0, 2, -6] },
            { id: panelIdCounter++, title: 'Communications', type: 'list', data: [
                { label: 'Pepper Potts', status: 'done', value: 'Read' },
                { label: 'Nick Fury', status: 'pending', value: 'Urgent' },
                { label: 'Peter Parker', status: 'pending', value: '1 New' }
            ], pos: [-3, -1, -5] },
            { id: panelIdCounter++, title: 'Power Core', type: 'chart', data: [90, 85, 88, 92, 95], pos: [3, -1, -5] },
            { id: panelIdCounter++, title: 'Satellite Uplink', type: 'text', data: 'Orbital sync complete. Latency: 12ms. Encryption: AES-256. Status: Stable.', pos: [0, -2, -8] }
        ];

        // --- 7. Создание панелей ---
        const panels = []; // { label, model, plane }

        function buildPanelDiv(model) {
            const div = document.createElement('div');
            div.innerHTML = createPanelContent(model);
            return div;
        }

        function attachPanelEvents(div, model) {
            // Делегирование событий на всю панель
            div.addEventListener('click', (e) => {
                if (!isEditMode) return;
                e.stopPropagation();
                const target = e.target;

                // Активируем панель (подсветка)
                document.querySelectorAll('.panel-active').forEach(el => el.classList.remove('panel-active'));
                const panelEl = target.closest('.panel-interactive');
                if (panelEl) panelEl.classList.add('panel-active');

                const action = target.dataset.action;

                if (action === 'delete-panel') {
                    deletePanel(model.id);
                    return;
                }

                if (action === 'toggle-status') {
                    const idx = parseInt(target.dataset.index);
                    const item = model.data[idx];
                    item.status = item.status === 'done' ? 'pending' : 'done';
                    item.value = item.status === 'done' ? 'Done' : 'Pending';
                    refreshPanel(model.id);
                    return;
                }

                if (action === 'delete-item') {
                    const idx = parseInt(target.dataset.index);
                    model.data.splice(idx, 1);
                    refreshPanel(model.id);
                    return;
                }

                if (action === 'add-item') {
                    model.data.push({ label: 'New task', status: 'pending', value: 'Pending' });
                    refreshPanel(model.id);
                    return;
                }

                if (action === 'edit-bar') {
                    const idx = parseInt(target.dataset.index);
                    model.data[idx] = Math.floor(Math.random() * 100);
                    refreshPanel(model.id);
                    return;
                }
            });

            // Редактирование текста (contenteditable)
            div.querySelectorAll('.editable-text').forEach(el => {
                el.setAttribute('contenteditable', 'true');
                el.addEventListener('blur', () => {
                    const field = el.dataset.field;
                    const idx = el.dataset.index !== undefined ? parseInt(el.dataset.index) : null;
                    const newValue = el.textContent.trim();

                    if (field === 'title') model.title = newValue;
                    else if (field === 'text') model.data = newValue;
                    else if (field === 'item-label' && idx !== null) model.data[idx].label = newValue;
                });
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
                });
            });
        }

        function refreshPanel(id) {
            const entry = panels.find(p => p.model.id === id);
            if (!entry) return;

            const newDiv = buildPanelDiv(entry.model);
            attachPanelEvents(newDiv, entry.model);

            entry.label.element.innerHTML = newDiv.innerHTML;

            // Перепривязываем события к новому DOM
            attachPanelEvents(entry.label.element, entry.model);

            // Сохраняем ссылку на новый div-контейнер
            entry.label.element = entry.label.element; // уже обновлён
        }

        function deletePanel(id) {
            const idx = panels.findIndex(p => p.model.id === id);
            if (idx === -1) return;
            scene.remove(panels[idx].label);
            scene.remove(panels[idx].plane);
            panels.splice(idx, 1);
        }

        function addPanel(model) {
            const div = buildPanelDiv(model);
            const label = new CSS2DObject(div);
            label.position.set(model.pos[0], model.pos[1], model.pos[2]);
            scene.add(label);

            const geometry = new THREE.PlaneGeometry(1.8, 1.2);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00d4ff,
                transparent: true,
                opacity: 0.05,
                side: THREE.DoubleSide
            });
            const plane = new THREE.Mesh(geometry, material);
            plane.position.copy(label.position);
            scene.add(plane);

            attachPanelEvents(div, model);

            panels.push({ label, model, plane });
        }

        panelModels.forEach(addPanel);

        // --- 8. Анимация ---
        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const speed = 15.0;
        const damping = 0.85;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            panels.forEach((entry, i) => {
                entry.label.position.y += Math.sin(elapsedTime * 2 + i) * 0.002;
                entry.label.rotation.y = Math.sin(elapsedTime * 0.5 + i) * 0.05;
                if (entry.plane) {
                    entry.plane.position.copy(entry.label.position);
                    entry.plane.rotation.copy(entry.label.rotation);
                }
            });

            particlesMesh.rotation.y = elapsedTime * 0.01;

            if (controls.isLocked && !isEditMode) {
                velocity.x -= velocity.x * (1 - damping) * 60 * delta;
                velocity.z -= velocity.z * (1 - damping) * 60 * delta;
                velocity.y -= velocity.y * (1 - damping) * 60 * delta;

                direction.z = Number(keyState.w) - Number(keyState.s);
                direction.x = Number(keyState.d) - Number(keyState.a);
                direction.y = Number(keyState.space) - Number(keyState.shift);
                direction.normalize();

                if (keyState.w || keyState.s) velocity.z -= direction.z * speed * delta;
                if (keyState.a || keyState.d) velocity.x -= direction.x * speed * delta;
                if (keyState.space || keyState.shift) velocity.y += direction.y * speed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                camera.position.y = Math.max(-2.5, Math.min(15, camera.position.y));
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
